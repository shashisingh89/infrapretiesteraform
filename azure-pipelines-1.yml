trigger:
- main

pool: infraaagent
stages:
  - stage: Infrastructure_Init
    displayName: Infrastructure create
    jobs:
      - job: TerraformInstaller 
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
      - job: init
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)\infrasetting\environments\dev'
            backendServiceArm: 'infraservices'
            backendAzureRmResourceGroupName: 'product-rg'
            backendAzureRmStorageAccountName: 'productstgs4'
            backendAzureRmContainerName: 'pipelinecontainer'
            backendAzureRmKey: 'pipeline.tfstate'
      - job: vaildate
        displayName: Configuration Validation
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)\infrasetting\environments\dev'
  - stage: Deployment_Verification
    displayName: Deployment Verification
    jobs:
      - job: tfsec
        steps:
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'
            dir: '$(System.DefaultWorkingDirectory)\infrasetting\environments\dev'
      - job: tflint
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tflint'
            workingDirectory: '$(System.DefaultWorkingDirectory)\infrasetting\environments\dev'
  - stage: Infra_Planning
    displayName: Infra Planning
    jobs:
      - job: plan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)\infrasetting\environments\dev'
            environmentServiceNameAzureRM: 'infraservices'
  - stage: Infrastructure_Deployment
    displayName: Infrastructure Deployment
    jobs:
      - job: apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)\infrasetting\environments\dev'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'infraservices'



